<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120907">
  <title>Portal dos Obreiros | Ministério Redenção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --bg:#090403;
      --bg2:#130907;
      --brown:#24130d;
      --gold:#d99b3a;
      --gold2:#efbd68;
      --paper:#fffaf2;
      --ink:#251b15;
      --muted:#796858;
      --line:#ead2a7;
      --wine:#713247;
    }

    *{
      box-sizing:border-box;
      font-family:"Montserrat",Arial,sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      color:#fff;
      background:
        radial-gradient(circle at 50% -120px,rgba(217,155,58,.18),transparent 430px),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    .site{
      width:min(100%,620px);
      min-height:100vh;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    /* CABEÇALHO PADRÃO OFICIAL */
    .header{
      position:relative;
      overflow:hidden;
      padding:18px 16px 24px;
      text-align:center;
      background:
        radial-gradient(circle at 50% 0,rgba(238,186,101,.08),transparent 300px),
        linear-gradient(180deg,#1e100b 0%,#0d0604 100%);
      border-bottom:1px solid rgba(217,155,58,.25);
    }

    .header::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:4px;
      background:linear-gradient(90deg,#8c5200,#efbd68,#9f5f00);
      box-shadow:0 0 20px rgba(239,189,104,.34);
    }

    .shine{
      position:absolute;
      top:0;
      left:-45%;
      width:28%;
      height:100%;
      transform:skewX(-18deg);
      background:linear-gradient(90deg,transparent,rgba(255,236,190,.10),transparent);
      animation:shine 6s ease-in-out infinite;
      pointer-events:none;
    }

    @keyframes shine{
      0%,68%{left:-45%}
      100%{left:130%}
    }

    .logo{
      display:block;
      width:min(100%,390px);
      max-height:180px;
      object-fit:contain;
      margin:0 auto 8px;
    }

    .portal-kicker{
      margin-top:4px;
      color:var(--gold2);
      font-size:10px;
      font-weight:800;
      letter-spacing:2.5px;
      text-transform:uppercase;
    }

    .portal-title{
      margin:7px 0 0;
      font-size:25px;
      line-height:1.08;
      font-weight:800;
    }

    .portal-sub{
      max-width:420px;
      margin:9px auto 0;
      color:#cbb9a8;
      font-size:11px;
      line-height:1.55;
    }

    .content{
      flex:1;
      padding:20px 16px 28px;
    }

    .intro{
      text-align:center;
      margin:4px 8px 17px;
    }

    .intro strong{
      display:block;
      color:#f0c76f;
      font-size:13px;
      margin-bottom:5px;
    }

    .intro span{
      color:#ae9c8c;
      font-size:11px;
      line-height:1.5;
    }

    .panel{
      padding:15px;
      border:1px solid rgba(217,155,58,.24);
      border-radius:22px;
      color:var(--ink);
      background:rgba(255,250,242,.99);
      box-shadow:0 20px 48px rgba(0,0,0,.30);
    }

    .grid{
      display:grid;
      gap:11px;
    }

    .portal-btn{
      width:100%;
      min-height:88px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:17px;
      background:#fff;
      color:var(--ink);
      display:flex;
      align-items:center;
      gap:13px;
      text-align:left;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(70,42,10,.05);
      transition:transform .14s ease,box-shadow .14s ease;
    }

    .portal-btn:active{
      transform:scale(.985);
    }

    .portal-btn.primary{
      color:#fff;
      border-color:rgba(224,174,47,.34);
      background:linear-gradient(135deg,#24160d,#0d0704);
    }

        .icon{
      width:50px;
      height:50px;
      flex:0 0 50px;
      border-radius:14px;
      display:grid;
      place-items:center;
      font-size:23px;
      font-weight:800;
      color:#1d1105;
      background:linear-gradient(145deg,#f2c963,#b87007);
      overflow:hidden;
    }

    .icon img{
      width:24px;
      height:24px;
      object-fit:contain;
      display:block;
    }

        .portal-btn strong{
      display:block;
      margin-bottom:4px;
      font-size:14px;
      font-weight:700;
    }

    .portal-btn span{
      display:block;
      color:var(--muted);
      font-size:10.5px;
      line-height:1.45;
      font-weight:500;
    }

    .portal-btn.primary span{
      color:#cbbcab;
    }

    .notice{
      display:none;
      margin-top:12px;
      padding:11px 12px;
      border:1px solid #e5c987;
      border-radius:13px;
      color:#755112;
      background:#fff2cc;
      font-size:11px;
      line-height:1.5;
    }

    /* RODAPÉ PADRÃO */
    .footer{
      position:relative;
      padding:20px 16px 24px;
      text-align:center;
      color:#8d7b69;
      background:rgba(4,2,1,.30);
      border-top:1px solid rgba(217,155,58,.13);
      font-size:9.5px;
      line-height:1.6;
    }

    .footer::before{
      content:"";
      display:block;
      width:64px;
      height:2px;
      margin:0 auto 12px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }

    .footer strong{
      color:#d5a558;
      font-size:10px;
      font-weight:800;
      letter-spacing:1.4px;
      text-transform:uppercase;
    }

    @media (max-width:420px){
      .header{
        padding-top:14px;
      }

      .logo{
        width:min(100%,340px);
        max-height:165px;
      }

      .portal-title{
        font-size:23px;
      }

      .content{
        padding-left:13px;
        padding-right:13px;
      }
    }
  
    .logo{
      display:block;
      width:min(100%,430px);
      max-height:170px;
      object-fit:contain;
      margin:0 auto 8px;
      background:transparent !important;
      filter:
        drop-shadow(0 0 10px rgba(240,190,88,.10))
        drop-shadow(0 0 18px rgba(210,133,25,.10));
    }

    .header{
      position:relative;
      overflow:hidden;
    }

    .header::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:4px;
      background:linear-gradient(90deg,#8c5200,#efbd68,#9f5f00);
      box-shadow:0 0 20px rgba(239,189,104,.34);
      overflow:hidden;
    }

    .header::before{
      content:"";
      position:absolute;
      bottom:0;
      left:-22%;
      width:22%;
      height:4px;
      z-index:3;
      background:linear-gradient(90deg,transparent,rgba(255,248,210,.98),transparent);
      filter:blur(.2px);
      animation:goldBarSweep 3.4s linear infinite;
      pointer-events:none;
    }

    @keyframes goldBarSweep{
      0%{ left:-24%; opacity:0; }
      8%{ opacity:1; }
      50%{ opacity:1; }
      100%{ left:102%; opacity:0; }
    }

  </style>
</head>

  <script src="config.js"></script>

  <script>
    function linkConfigurado(link){

      if(!link){
        return false;
      }

      const valor =
        String(link).trim();

      if(!valor){
        return false;
      }

      if(
        valor.startsWith(
          'COLE_AQUI_'
        )
      ){
        return false;
      }

      if(
        valor.toUpperCase() ===
        'COLOCAR_DEPOIS'
      ){
        return false;
      }

      return true;
    }


    function abrir(tipo){

      const link =
        LINKS[tipo];

      const aviso =
        document.getElementById(
          'aviso'
        );

      if(
        !linkConfigurado(link)
      ){

        aviso.style.display =
          'block';

        aviso.innerHTML =
          'O link ainda não foi configurado. ' +
          'Abra o arquivo <strong>config.js</strong> ' +
          'e coloque o endereço correspondente.';

        return;
      }

      aviso.style.display =
        'none';

      window.location.href =
        link;
    }
  </script>
